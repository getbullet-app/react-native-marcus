name: Integrate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  js:
    name: parser and units
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run fixtures:check

      - run: npx tsc --noEmit

      - run: npm run test:unit

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      - run: npm run web:build

      - run: npm run test:web

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci

      - run: npx expo prebuild -p android --no-install
        working-directory: example

      - run: npm run test:android

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-results
          path: android/build/reports/tests/
          retention-days: 14

  ios:
    name: ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - run: npm run test:ios

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          retention-days: 14

  e2e-ios:
    name: e2e ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Homebrew will not load a formula from a third-party tap until it is
      # trusted, and a runner has no prompt to answer.
      - name: Install applesimutils
        run: |
          brew tap wix/brew
          brew trust --formula wix/brew/applesimutils
          brew install applesimutils

      - run: npx expo prebuild -p ios --no-install
        working-directory: example

      - run: npx pod-install
        working-directory: example

      - run: npm run test:e2e:ios

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: detox-ios-artifacts
          path: artifacts/
          retention-days: 14

  e2e-android:
    name: e2e android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - run: npx expo prebuild -p android --no-install
        working-directory: example

      - run: npx detox build -c android

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          script: npx detox test -c android --headless

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: detox-android-artifacts
          path: artifacts/
          retention-days: 14
